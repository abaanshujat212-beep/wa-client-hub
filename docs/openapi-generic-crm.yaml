openapi: 3.1.0
info:
  title: WA Client Hub Generic CRM API
  version: 1.0.0
  description: Workspace-scoped CRM access. API keys are shown once, hashed at rest, scoped, revocable, and rate limited.
servers:
  - url: https://your-hub.example.com/api/generic/v1
security:
  - bearerAuth: []
paths:
  /contacts:
    get:
      summary: List contacts
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses: { '200': { description: Cursor-paginated contacts }, '429': { description: Per-key rate limit exceeded } }
    post:
      summary: Create or update a contact
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses: { '201': { description: Contact stored }, '409': { description: Idempotency conflict } }
  /conversations:
    get:
      summary: List conversations
      responses: { '200': { description: Workspace conversations } }
  /messages:
    get:
      summary: List messages
      parameters:
        - { name: conversationId, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: Conversation messages } }
  /consents:
    post:
      summary: Record auditable contact consent or withdrawal
      responses: { '201': { description: Consent recorded } }
  /events:
    post:
      summary: Ingest a canonical CRM event for a generic connector
      responses: { '202': { description: Event accepted or deduplicated }, '409': { description: Idempotency conflict } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: wah_api_key
x-scopes:
  - contacts:read
  - contacts:write
  - conversations:read
  - messages:read
  - consent:write
  - events:write
